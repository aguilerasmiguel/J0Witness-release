# Positivo (fase 2c, Task 7): instalación limpia de la librería sintética
# labvendor/lablib (raíz por <libraryname>: libraries/labvendor/lablib/,
# manifiesto en administrator/manifests/libraries/labvendor/lablib.xml —
# FilesRoot y ManifestDir NO coinciden, a diferencia de componente/módulo/
# plugin/plantilla) + su baseline oficial cacheado (misma versión) →
# verified:true, cero J0W-EXT-008/009.
case: ext-lib-verified
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-EXT-008
    - rule_id: J0W-EXT-009
mutations:
  - op: add_extension
    kind: library
  - op: add_extension_baseline
    kind: library
