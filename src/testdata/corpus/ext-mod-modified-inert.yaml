# Negativo de severidad (fase 2c, Task 7): archivo NO ejecutable de mod_labmod
# (tmpl/default.css) con contenido distinto al del paquete oficial →
# J0W-EXT-008 low, no eleva el exit code.
case: ext-mod-modified-inert
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  findings:
    - rule_id: J0W-EXT-008
      subject: modules/mod_labmod/tmpl/default.css
      min_severity: low
      max_severity: low
  not_findings:
    - rule_id: J0W-EXT-009
mutations:
  - op: add_extension
    kind: module
  - op: add_extension_baseline
    kind: module
  - op: replace_file
    path: modules/mod_labmod/tmpl/default.css
    content: "/* contenido distinto al del paquete oficial */\n.mod-labmod { display: none; }\n"
