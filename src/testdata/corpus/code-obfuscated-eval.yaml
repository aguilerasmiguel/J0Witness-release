# CODE-001: un ejecutable declarado por una extensión contiene un eval de payload
# ofuscado → J0W-CODE-001 critical, y su entrada en la red queda flagged_by_code.
case: code-obfuscated-eval
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CODE-001
      subject: components/com_labext/src/payload.php
      min_severity: critical
mutations:
  - op: add_extension
  - op: add_file
    path: components/com_labext/src/payload.php
    content: "<?php eval(gzinflate(base64_decode('AAAA'))); "
