# Positivo (fase 2c, Task 7): archivo que el paquete oficial de la plantilla
# labtpl distribuye pero que falta en el árbol instalado → J0W-EXT-009
# medium.
case: ext-tpl-official-missing
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-009
      subject: templates/labtpl/html/com_content/article.php
      min_severity: medium
mutations:
  - op: add_extension
    kind: template
  - op: add_extension_baseline
    kind: template
  - op: delete_file
    path: templates/labtpl/html/com_content/article.php
