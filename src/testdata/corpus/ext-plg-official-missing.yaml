# Positivo (fase 2c, Task 7): archivo que el paquete oficial de
# plg_system_labplg distribuye pero que falta en el árbol instalado (borrado
# selectivo o instalación incompleta) → J0W-EXT-009 medium.
case: ext-plg-official-missing
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-009
      subject: plugins/system/labplg/src/Handler.php
      min_severity: medium
mutations:
  - op: add_extension
    kind: plugin
  - op: add_extension_baseline
    kind: plugin
  - op: delete_file
    path: plugins/system/labplg/src/Handler.php
