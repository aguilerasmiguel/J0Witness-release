# Negativo: la variable se reasigna a un valor benigno antes del sink → sin J0W-CODE-*.
case: code-reassigned-split
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-CODE-001
    - rule_id: J0W-CODE-002
    - rule_id: J0W-CODE-004
mutations:
  - op: add_extension
  - op: add_file
    path: components/com_labext/src/reassigned.php
    content: "<?php $x = $_GET['cmd']; $x = '/bin/ls'; system($x); "
