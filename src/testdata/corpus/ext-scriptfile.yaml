# D3 (regresión): un componente declara su script de instalación con
# <scriptfile>. El script (installer.script.php) es un ejecutable declarado por
# el manifiesto; sin reconocer <scriptfile> saldría como J0W-EXT-001 High falso.
# Patrón real de com_j2xml/script.php y com_sppagebuilder/installer.script.php.
case: ext-scriptfile
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-EXT-001
      subject: administrator/components/com_scripted/installer.script.php
    - rule_id: J0W-CORE-004
mutations:
  - op: add_scriptfile_extension
