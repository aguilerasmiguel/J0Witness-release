# Positivo (fase 2c, Task 7): archivo que el paquete oficial de mod_labmod
# distribuye pero que falta en el árbol instalado → J0W-EXT-009 medium.
case: ext-mod-official-missing
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-009
      subject: modules/mod_labmod/tmpl/default.php
      min_severity: medium
mutations:
  - op: add_extension
    kind: module
  - op: add_extension_baseline
    kind: module
  - op: delete_file
    path: modules/mod_labmod/tmpl/default.php
