# Negativo de severidad (fase 2c, Task 7): archivo NO ejecutable de la
# librería labvendor/lablib (Support/notice.txt) con contenido distinto al del
# paquete oficial → J0W-EXT-008 low, no eleva el exit code.
case: ext-lib-modified-inert
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  findings:
    - rule_id: J0W-EXT-008
      subject: libraries/labvendor/lablib/Support/notice.txt
      min_severity: low
      max_severity: low
  not_findings:
    - rule_id: J0W-EXT-009
mutations:
  - op: add_extension
    kind: library
  - op: add_extension_baseline
    kind: library
  - op: replace_file
    path: libraries/labvendor/lablib/Support/notice.txt
    content: "contenido distinto al del paquete oficial\n"
