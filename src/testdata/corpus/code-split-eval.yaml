# Dataflow: decode partido en dos sentencias → J0W-CODE-001 critical.
case: code-split-eval
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CODE-001
      subject: components/com_labext/src/split1.php
      min_severity: critical
mutations:
  - op: add_extension
  - op: add_file
    path: components/com_labext/src/split1.php
    content: "<?php $f = gzinflate(base64_decode('AAAA')); eval($f); "
