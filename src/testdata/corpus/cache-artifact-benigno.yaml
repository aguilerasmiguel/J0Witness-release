# Positivo D4: artefacto de caché que Joomla genera (guarda die() + datos
# serializados) → J0W-CORE-005 degradado a info, no crítico. No dispara exit 1.
case: cache-artifact-benigno
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  findings:
    - rule_id: J0W-CORE-005
      subject: administrator/cache/com_modules/abc.php
      max_severity: info
mutations:
  - op: add_file
    path: administrator/cache/com_modules/abc.php
    content: "<?php die(\"Access Denied\"); ?>#x#a:1:{s:1:\"k\";i:1;}"
