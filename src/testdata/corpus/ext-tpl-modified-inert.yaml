# Negativo de severidad (fase 2c, Task 7): archivo NO ejecutable de la
# plantilla labtpl (css/template.css) con contenido distinto al del paquete
# oficial → J0W-EXT-008 low, no eleva el exit code.
case: ext-tpl-modified-inert
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  findings:
    - rule_id: J0W-EXT-008
      subject: templates/labtpl/css/template.css
      min_severity: low
      max_severity: low
  not_findings:
    - rule_id: J0W-EXT-009
mutations:
  - op: add_extension
    kind: template
  - op: add_extension_baseline
    kind: template
  - op: replace_file
    path: templates/labtpl/css/template.css
    content: "/* contenido distinto al del paquete oficial */\nbody { font-family: monospace; }\n"
