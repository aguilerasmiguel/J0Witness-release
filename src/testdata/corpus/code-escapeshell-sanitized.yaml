# Negativo: la superglobal en el primer argumento va envuelta en
# escapeshellarg() (sanitización de shell) → no debe disparar J0W-CODE-002.
case: code-escapeshell-sanitized
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-CODE-002
mutations:
  - op: add_extension
  - op: add_file
    path: components/com_labext/src/shell.php
    content: "<?php system(escapeshellarg($_GET['cmd'])); "
