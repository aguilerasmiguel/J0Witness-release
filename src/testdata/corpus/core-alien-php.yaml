# Positivo (escenario 4 + FR-035): PHP ajeno en directorio del core y webshell
# en directorio de escritura.
case: core-alien-php
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CORE-004
      subject: administrator/helpers.php
      min_severity: high
    - rule_id: J0W-CORE-005
      subject: images/cache.php
      min_severity: critical
mutations:
  - op: add_file
    path: administrator/helpers.php
    content: "<?php\nfunction helper_extra() { return 42; }\n"
  - op: add_file
    path: images/cache.php
    content: "<?php\n@assert($_REQUEST['q']);\n"
