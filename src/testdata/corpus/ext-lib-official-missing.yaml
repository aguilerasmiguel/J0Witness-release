# Positivo (fase 2c, Task 7): archivo que el paquete oficial de la librería
# labvendor/lablib distribuye pero que falta en el árbol instalado →
# J0W-EXT-009 medium.
case: ext-lib-official-missing
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-009
      subject: libraries/labvendor/lablib/Support/Helper.php
      min_severity: medium
mutations:
  - op: add_extension
    kind: library
  - op: add_extension_baseline
    kind: library
  - op: delete_file
    path: libraries/labvendor/lablib/Support/Helper.php
