# Positivo D4: log real de Joomla en administrator/logs. La cabecera real no
# es un solo '#' seguido de la guarda (como en la caché compilada), sino una
# línea '#' en blanco y LUEGO la guarda: "#\n#<?php die('Forbidden.'); ?>\n#Date...".
# Debe reconocerse como artefacto propio → J0W-CORE-005 degradado a info, no
# crítico. No dispara exit 1.
case: logs-artifact-benigno
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  findings:
    - rule_id: J0W-CORE-005
      subject: administrator/logs/joomla_update.php
      max_severity: info
mutations:
  - op: add_file
    path: administrator/logs/joomla_update.php
    content: "#\n#<?php die('Forbidden.'); ?>\n#Date: 2026-07-22 13:05:34 UTC\n#Fields: datetime priority message"
