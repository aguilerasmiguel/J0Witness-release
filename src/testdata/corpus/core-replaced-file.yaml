# Positivo: archivo del core sustituido → modificado.
case: core-replaced-file
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CORE-001
      subject: libraries/src/Router.php
      min_severity: high
mutations:
  - op: replace_file
    path: libraries/src/Router.php
    content: "<?php\nfunction route($p) { return $p; }\nfunction extra() { return 'reemplazado por completo con otra logica'; }\n"
