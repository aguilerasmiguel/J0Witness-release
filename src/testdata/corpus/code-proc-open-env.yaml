# Negativo: $_SERVER aparece como argumento env de proc_open (no en el primer
# argumento, que es el comando) → no debe disparar J0W-CODE-002.
case: code-proc-open-env
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-CODE-002
mutations:
  - op: add_extension
  - op: add_file
    path: components/com_labext/src/shell.php
    content: "<?php proc_open('/bin/ls', $d, $p, '/tmp', $_SERVER); "
