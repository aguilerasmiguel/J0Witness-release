# Positivo (FR-013): archivos de dos versiones → instalación mixta, no se
# colapsa a una sola. Se fuerza el baseline para poder completar el diff.
case: mixed-versions
base:
  cms: joomla
  version: "1.0.0"
scan_args: ["--joomla-version", "1.0.0"]
expect:
  exit_code: 1
  findings:
    - rule_id: J0W-CORE-008
      min_severity: medium
mutations:
  - op: overlay_version
    version: "1.1.0"
    paths:
      - libraries/src/App.php
      - media/js/app.js
      - language/en-GB/en-GB.ini
