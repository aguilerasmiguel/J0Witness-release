# Negativo (fase 2c, Task 7, Principio VI): el baseline cacheado de la
# librería labvendor/lablib declara una versión distinta a la instalada
# (4.1.0) → sin correspondencia exacta de versión, no se compara nada: cero
# J0W-EXT-008/009.
case: ext-lib-version-mismatch
base:
  cms: joomla
  version: "1.1.0"
expect:
  exit_code: 0
  not_findings:
    - rule_id: J0W-EXT-008
    - rule_id: J0W-EXT-009
mutations:
  - op: add_extension
    kind: library
  - op: add_extension_baseline
    kind: library
    version: "9.9.9"
